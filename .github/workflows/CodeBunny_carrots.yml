name: '🐰 CodeBunny Agent'

on:
  pull_request:
    # 'synchronize' ensures the bot runs again if the user pushes new code to the PR
    types: [opened, reopened, synchronize]

jobs:
  dispatch_analysis:
    name: 🥕 Dispatch to HQ
    runs-on: ubuntu-latest
    steps:
      - name: 📡 Contacting CodeBunny Brain (Render)
        id: webhook
        run: |
          echo "🥕 Sniffing the carrot... (Sending Webhook)"
          
          # We use curl to send the event data to your Render server.
          # --fail ensures the job turns Red if Render returns an error (4xx/5xx).
          # --max-time ensures we don't hang forever if the server is cold.
          
          curl -v -X POST "${{ secrets.CODEBUNNY_SERVICE_URL }}/webhook/github" \
          -H "Content-Type: application/json" \
          -d '${{ toJSON(github) }}' \
          --fail \
          --max-time 100
          
          echo "✅ Signal received. Analysis in progress."